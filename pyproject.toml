[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eci-framework"
version = "5.8.0"
description = "ECI Framework v5.8 - Nervous System (precog forecasting + neural cortex)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arash Mansourpour" }]
keywords = [
    "quantum-computing",
    "quantum-machine-learning",
    "quantum-error-correction",
    "quantum-metrology",
    "tensor-networks",
    "integrated-information-theory",
    "global-workspace",
    "free-energy-principle",
    "distributed-consensus",
    "federated-learning",
    "neuromorphic",
    "meta-learning",
    "autopoiesis",
    "data-dao",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "scipy>=1.14",  # MWPM Hungarian decoder (topological QEC)
    "pyyaml>=6.0",
    "cryptography>=41",  # Ed25519 agent keys (protocol0/keys)
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.13", "ruff>=0.4"]
viz = ["matplotlib>=3.9"]
paper = ["matplotlib>=3.9", "reportlab>=4.0", "pyyaml>=6.0"]
qec = ["stim", "pymatching"]  # scale-up QEC: circuit Monte Carlo + Blossom MWPM
eeg = ["mne"]  # real EEG recordings for awareness calibration
pqc = ["liboqs-python"]  # NIST ML-KEM/ML-DSA via liboqs adapter

[project.scripts]
eci = "eci.__main__:main"

[project.urls]
Documentation = "https://github.com/arash-mansourpour/eci-framework"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = [
    "E501",  # long lines in scientific formulas / docstrings
    "N802",  # PascalCase allowed for physics-style function names (e.g. QFT helpers)
    "N803",  # physics argument names (rho, psi)
    "N806",  # physics variable names (rho, psi)
    "B008",  # default device factories
    "SIM108",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
